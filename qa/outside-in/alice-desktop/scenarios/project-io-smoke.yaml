id: alice-desktop-project-io-smoke
title: Project IO smoke
workflow: project-io-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Project save and load characterization tests are available in the checkout.
userActions:
  - Run the focused project IO characterization smoke from the command line.
  - Create or use a synthetic Alice project fixture.
  - Save, reload, and compare observable project metadata or resource survival.
expectedOutcomes:
  - The project IO smoke command exits successfully when the gate is enabled.
  - Saved project artifacts can be reopened by the current Alice IO path.
  - Observable project metadata or resource identity survives the round trip.
automation:
  cwd: .
  command: mvn -DincludeSims=false -Dinstall4j.skip -pl core/ide -am -Dtest=org.alice.ide.ProjectSaveTargetPlanTest test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the project IO smoke command.
    - Saved project or synthetic project artifact reference when available.
    - Notes identifying the metadata or resource survival assertion reviewed.
fallback:
  mode: manual-evidence-required
  notes:
    - If the focused Maven smoke is unavailable, attach the nearest project save/load characterization evidence.
    - Manual GUI save/load evidence remains covered separately by alice-desktop-save-load.
supportingEvidence:
  - alice-desktop-save-load
tags:
  - immediate-qa-backlog
  - project-io
  - command-smoke
